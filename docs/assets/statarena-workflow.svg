<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="388" viewBox="0 0 1320 388" role="img" aria-labelledby="title description">
  <title id="title">StatArena statistical research workflow</title>
  <desc id="description">Design leads to data. Data can lead directly to prediction or inference, or reach either via discovery and selection. Prediction and inference both inform decisions. Diagnostics span the workflow. Inference is StatArena's current focus.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="10" refX="8.3" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#445775" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dashed-arrow" markerWidth="9" markerHeight="10" refX="8.3" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#6C7F99" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1318" height="386" rx="22" fill="#F8FAFD" stroke="#CBD6E5" stroke-width="2"/>
  <path d="M23 2H1297A21 21 0 0 1 1318 23V65H2V23A21 21 0 0 1 23 2Z" fill="#EEF3FA"/>
  <path d="M2 65H1318" stroke="#D9E3F0"/>
  <g font-family="Inter, 'Liberation Sans', Arial, sans-serif" text-anchor="middle" fill="#243755">
    <text x="660" y="42" font-size="23" font-weight="600">Diagnostics across all stages</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#445775" stroke-width="2.3" marker-end="url(#arrow)">
      <path id="design-data" d="M189 175H226"/>
      <path id="data-prediction" d="M359 154H378Q392 154 392 140V134Q392 120 406 120H857"/>
      <path id="data-inference" d="M359 198H365Q379 198 379 212V334Q379 348 393 348H811Q825 348 825 334V318Q825 304 839 304H857"/>
      <path id="prediction-decision" d="M1051 120H1068Q1082 120 1082 134V153Q1082 167 1096 167H1123"/>
      <path id="inference-decision" d="M1051 282H1078Q1092 282 1092 268V209Q1092 195 1106 195H1123"/>
    </g>
    <g stroke="#6C7F99" stroke-width="2.2" stroke-dasharray="4 5" marker-end="url(#dashed-arrow)">
      <path id="data-discovery" d="M359 176H383Q397 176 397 190V250Q397 264 411 264H424"/>
      <path id="discovery-selection" d="M583 264H622"/>
      <path id="selection-prediction" d="M785 245H798Q812 245 812 231V157Q812 143 826 143H857"/>
      <path id="selection-inference" d="M785 279H857"/>
    </g>
  </g>

  <g font-family="Inter, 'Liberation Sans', Arial, sans-serif" text-anchor="middle">
    <g fill="#FFFFFF" stroke="#C5D2E3" stroke-width="1.6">
      <rect x="45" y="139" width="144" height="72" rx="14"/>
      <rect x="232" y="139" width="127" height="72" rx="14"/>
      <rect x="430" y="228" width="153" height="72" rx="14" fill="#F0F4FA"/>
      <rect x="628" y="228" width="157" height="72" rx="14" fill="#F0F4FA"/>
      <rect x="863" y="84" width="188" height="72" rx="14"/>
      <rect x="1129" y="143" width="146" height="76" rx="14"/>
    </g>

    <rect x="863" y="233" width="188" height="94" rx="15" fill="#25449A"/>
    <g fill="#182943" font-size="25" font-weight="600">
      <text x="117" y="184">Design</text>
      <text x="295.5" y="184">Data</text>
      <text x="506.5" y="273">Discovery</text>
      <text x="706.5" y="273">Selection</text>
      <text x="957" y="129">Prediction</text>
      <text x="1202" y="190">Decision</text>
    </g>
    <text x="957" y="274" fill="#FFFFFF" font-size="26" font-weight="700">Inference</text>
    <text x="957" y="301" fill="#E4EDFF" font-size="18" font-weight="500">Current focus</text>
  </g>
</svg>
