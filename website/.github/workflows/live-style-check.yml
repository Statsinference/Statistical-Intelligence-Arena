name: Verify deployed website
on:
  push:
    branches: [style/arena-layout]
    paths: [.github/workflows/live-style-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Check deployed page, domains, logo and mobile navigation
        run: |
          mkdir -p verification
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          errors=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1100},device_scale_factor=1)
              page.on('pageerror',lambda e:errors.append(str(e)))
              response=page.goto('https://statsinference.github.io/?v=739c657',wait_until='networkidle',timeout=60000)
              assert response.status==200, response.status
              assert page.locator('#sidebar').count()==1
              assert page.locator('[data-t]').count()==10
              assert page.locator('.brand-logo').evaluate('(im)=>im.complete&&im.naturalWidth===192')
              assert page.locator('tbody tr.row-pending').count()==2
              assert page.evaluate('document.documentElement.dataset.theme')=='light'
              await_fonts=page.evaluate('async()=>{await document.fonts.ready;return [...document.fonts].filter(f=>f.status==="loaded").map(f=>f.family)}')
              domains=page.locator('[data-t]').evaluate_all('(els)=>els.map(e=>({id:e.dataset.t,name:e.childNodes[0].textContent}))')
              for d in domains:
                  page.locator('[data-t="'+d['id']+'"]').click()
                  assert page.locator('#hero-title').inner_text()==d['name']
              page.locator('[data-t="ate"]').click()
              page.locator('[data-split="ID"]').click()
              assert page.locator('tbody tr').count()==1
              page.locator('[data-split="OOD"]').click()
              assert page.locator('tbody tr').count()==1
              page.locator('[data-split="both"]').click()
              page.screenshot(path='verification/StatsArena_live_desktop.png',full_page=False)
              page.screenshot(path='verification/StatsArena_live_full.png',full_page=True)
              page.locator('#theme-btn').click()
              assert page.evaluate('document.documentElement.dataset.theme')=='dark'
              page.screenshot(path='verification/StatsArena_live_dark.png',full_page=False)
              page.locator('#theme-btn').click()
              page.set_viewport_size({'width':390,'height':844})
              assert page.evaluate('document.documentElement.scrollWidth<=innerWidth')
              page.locator('#menu-btn').click()
              page.locator('[data-t="semi_supervised"]').click()
              assert page.locator('#hero-title').inner_text()=='Semi-Supervised Inference'
              assert page.locator('#menu-scrim').is_hidden()
              assert page.evaluate('document.documentElement.scrollWidth<=innerWidth')
              page.screenshot(path='verification/StatsArena_live_mobile.png',full_page=True)
              data=page.request.get('https://statsinference.github.io/data/results.json').json()
              assert data=={'schema_version':1,'suites':[]}
              assert not errors,errors
              report={'status':'passed','homepage_http_status':response.status,'domain_count':len(domains),'domains':domains,'logo_loaded':True,'logo_dimensions':[192,192],'light_and_dark':True,'id_ood_switches':True,'mobile_navigation':True,'page_errors':errors,'fonts_loaded':await_fonts,'no_results_published':True,'url':'https://statsinference.github.io/?v=739c657'}
              Path('verification/report.json').write_text(json.dumps(report,indent=2))
              print(json.dumps(report,indent=2))
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-website-verification
          path: verification/
          retention-days: 2
