name: MathJax newline probe
on:
  push:
    branches: [codex/github-md-probe-20261117]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts mathjax-full@3.2.2 jsdom@26.1.0
      - name: Compare Github Markdown API MathJax output
        env:
          GH_TOKEN: TOKEN_PLACEHOLDER
        run: |
          node - <<'JS'
          const {JSDOM}=require('jsdom');const {mathjax}=require('mathjax-full/js/mathjax.js');const {TeX}=require('mathjax-full/js/input/tex.js');const {SVG}=require('mathjax-full/js/output/svg.js');const {liteAdaptor}=require('mathjax-full/js/adaptors/liteAdaptor.js');const {RegisterHTMLHandler}=require('mathjax-full/js/handlers/html.js');const {AllPackages}=require('mathjax-full/js/input/tex/AllPackages.js');
          const adapter=liteAdaptor();RegisterHTMLHandler(adapter);
          const tex=new TeX({packages:AllPackages,formatError:(_jax,e)=>{throw e}});const doc=mathjax.document('',{InputJax:tex,OutputJax:new SVG({fontCache:'none'})});
          const expr=String.raw`\begin{aligned}
          L_{0} &= 1.5\cdot T_{00}+\varepsilon_{1} \\
          U_{0} &= 1.5\cdot T_{00}+\varepsilon_{2}.
          \end{aligned}`;
          const sample=String.fromCharCode(96).repeat(3)+'math\n'+expr+'\n'+String.fromCharCode(96).repeat(3);
          fetch('https://api.github.com/markdown',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({text:sample,mode:'gfm',context:'Statsinference/stats-inference-arena'})}).then(async r=>{if(!r.ok)throw Error('HTTP '+r.status);let s=await r.text();let got=new JSDOM(s).window.document.querySelector('math-renderer.js-display-math').textContent.trim().slice(2,-2).trim();console.log('source',JSON.stringify(expr));console.log('github',JSON.stringify(got));let a=adapter.outerHTML(doc.convert(expr,{display:true}));let b=adapter.outerHTML(doc.convert(got,{display:true}));console.log('byteEqualMath',expr===got,'identicalSVG',a===b);if(a!==b){let i=0;while(a[i]===b[i]&&i<Math.min(a.length,b.length))i++;console.log('SVG first difference',i,JSON.stringify(a.slice(i-80,i+100)),JSON.stringify(b.slice(i-80,i+100))}}).catch(e=>{console.error(e);process.exitCode=1});
          JS
