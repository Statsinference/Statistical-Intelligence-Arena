name: GitHub inline rowbreak probe
on:
  push:
    branches: [codex/github-md-probe-20261117]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe rowbreak followed by a space
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const tick=String.fromCharCode(96).repeat(3);
          const expr='\\begin{aligned} L_0 &= 1 \\\\ U_0 &= 2 \\end{aligned}';
          const sample=tick+'math\n'+expr+'\n'+tick;
          fetch('https://api.github.com/markdown',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({text:sample,mode:'gfm',context:'Statsinference/stats-inference-arena'})}).then(async r=>{if(!r.ok)throw Error('HTTP '+r.status);console.log('source',JSON.stringify(expr));console.log('html',await r.text())}).catch(e=>{console.error(e);process.exitCode=1});
          JS
