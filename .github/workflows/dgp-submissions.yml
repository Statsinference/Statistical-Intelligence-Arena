name: DGP submissions
on:
  # A ZIP submission is checked in full, including any other changed paths.
  # Website Markdown submissions have their own precheck.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - 'dgp-submissions/incoming/**'
  push:
    branches: [main]
    paths:
      - 'dgp-submissions/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/dgp-submissions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: statsarena-dgp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate-pr:
    name: ZIP-only submission review
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    defaults:
      run:
        working-directory: dgp-submissions
    steps:
      - uses: actions/checkout@v4
        with:
          # Never checkout the contributor head/merge tree, including same-repo PRs.
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ZIP-only static diff check (trusted base code)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python integration/zip_only_gate.py check
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Protect the surrounding benchmark repository
        run: python integration/verify_isolation.py capture
      - name: Test parser on frozen fixtures and independent edge cases
        run: python integration/run_regressions.py
      - name: Generate an isolated review preview
        run: |
          python -m tools.dgp_registry.github_intake --incoming incoming --output registry
          python integration/zip_only_gate.py verify-report
          python integration/sync_contributing.py
          python -m pytest tests/test_integration.py -q
          python integration/verify_isolation.py verify
          cat registry/PR_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          cat registry/INTAKE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dgp-review-preview
          path: |
            CONTRIBUTING.md
            dgp-submissions/registry/
          retention-days: 14
      - name: Attach verdict to the exact reviewed PR commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: python integration/zip_only_gate.py finish
  publish:
    name: Prepare DGP catalog pull request
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dgp-submissions
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Capture protected benchmark files
        run: python integration/verify_isolation.py capture
      - name: Test parser on frozen fixtures and independent edge cases
        run: python integration/run_regressions.py
      - name: Index submitted ZIPs without executing their code
        run: |
          python -m tools.dgp_registry.github_intake --incoming incoming --output registry
          cat registry/PR_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          cat registry/INTAKE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Synchronize the contribution landing and verify registry output
        run: |
          python integration/sync_contributing.py
          python -m pytest tests/test_integration.py -q
          python integration/verify_isolation.py verify
      - name: Stage the generated DGP catalog for review
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- CONTRIBUTING.md dgp-submissions/registry
          if git diff --cached --quiet; then
            echo 'The DGP catalog and Contributing page are current.'
            exit 0
          fi
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          invalid = [p for p in changed if p and p != 'CONTRIBUTING.md' and not p.startswith('dgp-submissions/registry/')]
          if invalid:
              raise SystemExit('Refusing changes outside DGP output: ' + repr(invalid))
          PY

          git fetch --no-tags origin refs/heads/main
          base=$(git rev-parse HEAD)
          if [[ $(git rev-parse FETCH_HEAD) != "$base" ]]; then
            echo '::error::main changed during generation. Rerun this workflow against the latest main.'
            exit 1
          fi

          branch=submissions/data-catalog
          ref=refs/heads/$branch
          tree=$(git write-tree)
          previous=$(git ls-remote origin "$ref" | cut -f1)
          parents=(-p "$base")
          needs_push=true
          if [[ -n "$previous" ]]; then
            git fetch --no-tags origin "$ref"
            if [[ $(git rev-parse FETCH_HEAD) != "$previous" ]]; then
              echo '::error::The catalog review branch changed during preparation. Rerun this workflow.'
              exit 1
            fi
            if [[ "$tree" == $(git rev-parse "$previous^{tree}") ]]; then
              echo 'The generated catalog is already on the review branch.'
              needs_push=false
            elif ! git merge-base --is-ancestor "$previous" "$base"; then
              # Preserve the previous review head so the branch update is fast-forward.
              parents+=(-p "$previous")
            fi
          fi
          if [[ "$needs_push" == true ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            commit=$(git commit-tree "$tree" "${parents[@]}" -m 'chore: refresh DGP Contributing catalog')
            git push origin "$commit:$ref"
          fi

          pr_url=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f base=main -f head="$GITHUB_REPOSITORY_OWNER:$branch" -f state=open \
            --jq '.[0].html_url // empty')
          if [[ -z "$pr_url" ]]; then
            if ! pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main \
              --title 'Refresh the DGP contribution catalog' \
              --body 'Regenerated the contribution guide and catalog from the ZIPs already merged into main. Please review the generated changes before merging.'); then
              pr_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
              echo '::warning::GitHub did not create the catalog PR. Open it from the workflow summary.'
            fi
          fi
          printf '\nDGP catalog review: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
