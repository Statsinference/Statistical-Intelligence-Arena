name: Sync method submissions
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  issues:
    types: [opened, edited, reopened, closed]
  push:
    branches: [main]
    paths:
      - .github/workflows/method-submissions-sync.yml
      - website/method-submissions/sync.py
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: method-submissions-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            method-submissions
            website/method-submissions
      - name: Archive private method submissions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 website/method-submissions/sync.py
      - name: Save the submission list
        shell: bash
        run: |
          mkdir -p method-submissions/received method-submissions/checks
          git add -- method-submissions/received method-submissions/checks
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync method submission links'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
