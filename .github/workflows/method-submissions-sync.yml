name: Sync method submissions
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  issues:
    types: [opened, edited, reopened, closed]
  push:
    branches: [main]
    paths:
      - .github/workflows/method-submissions-sync.yml
      - website/method-submissions/sync.py
      - website/method-submissions/stage_reviews.py
      - method-submissions/received/**
      - method-submissions/checks/**
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  pull-requests: write
concurrency:
  group: method-submissions-sync
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[Method submission] ') ||
      startsWith(github.event.changes.title.from, '[Method submission] ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            method-submissions
            website/method-submissions
      - name: Prepare method submissions for review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 -B website/method-submissions/stage_reviews.py
