name: LaTeX display validation (isolated)
on:
  push:
    branches: [fix/latex-display-fidelity]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression test dependency
        run: python -m pip install pytest==8.4.2
      - name: Export immutable regression fixture for local reproduction
        run: git archive --format=zip 7585d6cd609a5948868d7d45351eb42fd258bbe0 dgp-submissions/incoming dgp-submissions/registry > render-test-fixture.zip
      - name: Existing regression suite (no submitted code execution)
        working-directory: dgp-submissions
        run: python integration/run_regressions.py
      - name: Preserve private validation snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-validation-snapshot
          retention-days: 1
          path: |
            dgp-submissions/
            CONTRIBUTING.md
            README.md
            docs/
            starter/
            scripts/
            render-test-fixture.zip
