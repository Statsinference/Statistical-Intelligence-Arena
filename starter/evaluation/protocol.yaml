  length_comparison: "only among methods passing same target/scope coverage gate; also show overcoverage and availability"
  global_total_score: "not_defined"
monte_carlo:
  independent_binary_trials: "binomial interval and sqrt(p*(1-p)/R)"
  dependent_queries: "aggregate at independent-replicate level or use design-aware uncertainty"
  planning_example_only: "p=.95 and R=1000 gives MCSE about .0069; not a result or minimum"
failures:
  all_scheduled_attempts_retained: true
  statuses: ["ok", "unsupported", "abstained", "failed", "not_identified"]
  report: ["counts and denominators", "valid-output coverage", "all-attempt valid-and-covering rate", "availability", "timeouts/nonfinite/infrastructure reasons"]
  infinite_lengths_retained: true
  infrastructure_retry_rule: "TODO: freeze before comparison"
cost:
  separate: ["offline_training_seconds", "load_seconds", "warm_end_to_end_seconds"]
  warm_includes: ["preprocessing", "fitting/calibration/correction", "all model calls", "interval/set construction", "export"]
  forward_only: "supplementary, never substitute for end-to-end"
  measurement: "TODO: hardware, precision, threads, batching, warmup and repetitions"
observed_label_budget:
  total_per_method: "TODO: matched total observed labels"
  allocations: "TODO: context/calibration/tuning/other held-out labels per method"
  different_budget_comparison: "separately labeled with all allocations disclosed"
contract_limits:
  output_schema_version: "0.2.0"
  parameter_ci: "one connected interval, possibly unbounded; empty/disconnected parameter confidence sets need extension"
  prohibited_coercions: "do not relabel parameter sets as prediction_set or silently take convex hull"
family_contracts:
  cate: "fixed x/query grid or groups; declare weighting and coverage scope; correlated queries do not increase independent R"
  did: "panel/repeated-cross-section design, timing, target, parallel trends, no anticipation and dependence"
  synthetic_control: "separate donor, pre/post, contamination, counterfactual-model and dependence contract; do not inherit DiD assumptions automatically"
