current_family_ids: [ate, cate, mediation, iv, proximal, did_sc]
layer_B_required: true
layer_A_enabled: false
target_id: "nie"
target_object: "parameter_ci"
coverage_scope: "marginal"
repeated_sampling:
  fixed_dgp_configs: "TODO: exact parameters, truth and independent-unit definition"
  sample_sizes_n: "TODO: prespecified grid"
  repetitions_R: "TODO: per fixed DGP and n, justified by MC precision"
  seeds: "TODO: immutable ledger"
  rerun_full_pipeline: true
  pair_methods_on_same_observed_dataset: true
  average_over_training_prior_replaces_fixed_dgp_results: false
  independent_sampling_unit: "TODO: experiment, not correlated query or panel row"
  model_training_seeds: "TODO: fixed checkpoint or separate variation"
coverage_gate:
  nominal_level: "TODO: predeclare; no universal nominal level selected"
  undercoverage_tolerance: "TODO: register before results"
  confidence_bound_method_and_level: "TODO: Wilson/exact or design-aware alternative"
  acceptance_rule: "TODO: e.g. lower bound relative to registered tolerance"
  coverage_basis: "TODO: valid_output or all_attempt_valid_covering"
  denominator: "TODO: explicit count and eligibility, including zero-valid-output policy"
  availability_failure_rule: "TODO: prevent selective abstention passing conditional coverage alone"
  insufficient_precision: "inconclusive, not pass"
  universal_cutoff_or_R_minimum: false
metrics:
  point: ["bias", "RMSE"]
  parameter_or_mean_uncertainty: ["empirical estimator variance", "reported variance/SE calibration", "coverage", "length"]
