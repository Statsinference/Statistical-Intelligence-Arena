[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "statarena-lite"
version = "0.1.0"
description = "Run the public StatArena starter benchmarks locally"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
statarena-lite = "statarena_lite.cli:main"

[tool.setuptools]
packages = ["statarena_lite"]
